{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="card p-4">
            <h1 class="h4 mb-1">股票查詢</h1>
            <p class="text-muted small mb-4">輸入台股代碼，查看即時報價、五檔與歷史走勢</p>

            {% if error %}
            <div class="alert alert-danger py-2"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('stock') }}" method="post">
                <div class="mb-3">
                    <label for="stock_code" class="form-label">股票代碼</label>
                    <input type="text" class="form-control form-control-lg" id="stock_code" name="stock_code"
                           placeholder="例如 2330" required autofocus>
                    <div class="mt-2">
                        {% for code, name in popular %}
                        <button type="button" class="btn btn-sm btn-outline-secondary me-1 mb-1"
                                onclick="document.getElementById('stock_code').value='{{ code }}'">{{ code }} {{ name }}</button>
                        {% endfor %}
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-6">
                        <label for="year" class="form-label">年份</label>
                        <select id="year" name="year" class="form-select">
                            <option value="">最近 31 個交易日</option>
                            {% for year in range(current_year, 2009, -1) %}
                            <option value="{{ year }}">{{ year }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-6">
                        <label for="month" class="form-label">月份</label>
                        <select id="month" name="month" class="form-select">
                            <option value="">整年</option>
                            {% for month in range(1, 13) %}
                            <option value="{{ month }}">{{ month }} 月</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100"><i class="bi bi-search me-1"></i>查詢</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
